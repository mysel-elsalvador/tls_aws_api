version = 0.4

[default.global.parameters]
region = "us-east-2" # same account and region as the ingest stack (../tls_aws_ingest)

[default.build.parameters]
cached = false

[dev.deploy.parameters]
stack_name = "hub-web-dev"
resolve_s3 = true
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
confirm_changeset = false
parameter_overrides = "Stage=dev IngestStack=hub-dev AllowLocalDev=true"

# Site domain: `make cert DOMAIN=app.example.com [ZONE=Z...]` (us-east-1), then add
# DomainName=app.example.com CertificateArn=arn:aws:acm:us-east-1:... [HostedZoneId=Z...] to parameter_overrides.
[prod.deploy.parameters]
stack_name = "hub-web-prod"
resolve_s3 = true
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
confirm_changeset = true
parameter_overrides = "Stage=prod IngestStack=hub-prod AllowLocalDev=false"
